# RustSec advisories against upstream rustls 0.23.43 that this fork fixes by backporting the
# upstream fix. Busbar's FIPS line is held at rustls 0.23.43 because every patched release requires
# aws-lc-rs >= 1.18, which binds AWS-LC-FIPS 4 (not the validated AWS-LC-FIPS-3.1.0). The version
# stays 0.23.43 so `=0.23.43` requirements resolve to this fork through [patch.crates-io].
#
# Each entry: `upstream` is the upstream commit whose source change is backported; `fix` is the fork
# commit that carries it; `proof` is the regression test (path::name), committed before the fix and
# red on 0.23.43 in this fork's CI (.github/workflows/busbar-proof.yml). Consumers accept an advisory only by an entry here at their pin.
# One-line arrays only: consumers read this file line by line.
schema = "busbar.fork.advisories.v1"
crate = "rustls"
version = "0.23.43"

# CVE-2026-123613: TLS 1.3 handshake messages accepted across encryption level boundaries.
[[advisory]]
id = "RUSTSEC-2026-0285"
aliases = ["CVE-2026-123613", "GHSA-2mjx-qc3c-rqvc"]
status = "fixed-in-fork"
remedy = "upstream-fix-backported"
upstream = "f9d4ee92b20da535ef5982ffcaf6f62385f79641"
fix = "87879218bff56291dda41c9680723226d22bdb01"
proof = ["tests/api.rs::client_rejects_encrypted_extensions_in_server_hello_record", "tests/api.rs::client_connection_rejects_record_containing_subsequent_messages", "tests/api.rs::server_connection_rejects_record_containing_subsequent_messages", "tests/api.rs::client_hello_acceptor_rejects_record_containing_subsequent_messages"]

# CVE-2026-123609: Debug of Tls12ClientSessionValue / Tls13ClientSessionValue prints the secret.
[[advisory]]
id = "RUSTSEC-2026-0346"
aliases = ["CVE-2026-123609", "GHSA-c8m5-c952-6cm4"]
status = "fixed-in-fork"
remedy = "upstream-fix-backported"
upstream = "dcdb9464d376f45f42a94a5f837cda1506449f23"
fix = "14b1cb3273fe9e297c88201108b3ad5bf9c6f62d"
proof = ["src/client/handy.rs::debug_of_session_types"]

# CVE-2026-123610: brotli certificate decompression accepts large-window streams (1 GiB allocation).
[[advisory]]
id = "RUSTSEC-2026-0348"
aliases = ["CVE-2026-123610", "GHSA-h2v8-394m-p7vv"]
status = "fixed-in-fork"
remedy = "upstream-fix-backported"
upstream = "1aa987af37d0d79b98781d345895ac0059ce345c"
fix = "bd4ff63af53db4d20f1c7aa18f863bcc90c0e2e3"
proof = ["src/compress.rs::test_brotli_rejects_large_window"]

# CVE-2026-123611: an unauthenticated ServerHello sets the key-share hint for later connections.
[[advisory]]
id = "RUSTSEC-2026-0349"
aliases = ["CVE-2026-123611", "GHSA-w44r-93j7-qv28"]
status = "fixed-in-fork"
remedy = "upstream-fix-backported"
upstream = "f04804fa13341a9b1dc02b5d1dd8a746f2c4b7fb"
fix = "b8763c701263d60dbdd67523128fba957e0e1e19"
proof = ["tests/api.rs::test_client_does_not_save_kx_hint_from_unauthenticated_server_hello"]
